<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>ruletka.vip — offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="brand.js?v=2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0b0e;
      --fg: #f2f3f7;
      --muted: #9aa0b4;
      --accent: #ff6b5a;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(255, 107, 90, 0.12), transparent 55%),
        radial-gradient(700px 400px at 90% 80%, rgba(90, 140, 255, 0.1), transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    .card {
      width: min(420px, 100%);
      padding: 28px 24px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a, button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .primary {
      background: linear-gradient(135deg, #ff7a6a, #e84d3d);
      color: #fff;
    }
    .ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/brand/icon-192.png" width="72" height="72" alt="" />
    <h1>You’re offline</h1>
    <p>
      Matching needs a network connection. Cached pages may still open;
      video chat requires being back online.
    </p>
    <div class="actions">
      <button type="button" class="primary" id="retry">Try again</button>
      <a class="ghost" href="/">Home</a>
      <a class="ghost" href="/live.html">Live</a>
    </div>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () {
      if (navigator.onLine) location.href = "/live.html";
      else location.reload();
    });
    window.addEventListener("online", function () {
      location.href = "/live.html";
    });
    if (window.RuletBrand && RuletBrand.apply) RuletBrand.apply(document);
  </script>
</body>
</html>
