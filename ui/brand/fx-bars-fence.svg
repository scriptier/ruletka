<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <!-- Cool steel along the wire -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8ea"/>
      <stop offset="35%" stop-color="#a8aab0"/>
      <stop offset="55%" stop-color="#6e7278"/>
      <stop offset="75%" stop-color="#b4b6bc"/>
      <stop offset="100%" stop-color="#8a8e94"/>
    </linearGradient>
    <!-- Rust wash along some segments -->
    <linearGradient id="rustWire" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#6a3a22" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a04a28" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#c46830" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3220" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.4" dy="0.8" stdDeviation="0.6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!--
    Open diamond chain-link (large cells, thin wire).
    Two diagonal families form the classic fence weave.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- Direction \  -->
    <path stroke="url(#steel)" stroke-width="2.15"
      d="M-24,24 L24,-24 M0,96 L96,0 M48,120 L120,48 M-24,72 L72,-24 M24,120 L120,24"/>
    <!-- Direction /  -->
    <path stroke="url(#steel)" stroke-width="2.15"
      d="M-24,72 L72,-24 M0,120 L120,0 M48,120 L-24,48 M24,-24 L120,72 M-24,0 L0,-24 M72,120 L120,72"/>
    <!-- Slight highlight on top edge of wires -->
    <path stroke="#f2f2f4" stroke-width="0.55" stroke-opacity="0.55"
      d="M-24,22 L24,-26 M0,94 L96,-2 M48,118 L120,46"/>
    <!-- Sparse rust streaks on a few strands -->
    <path stroke="url(#rustWire)" stroke-width="2.4"
      d="M0,96 L48,48 M48,120 L96,72"/>
    <path stroke="url(#rustWire)" stroke-width="2.2"
      d="M-12,60 L36,12 M60,108 L108,60"/>
  </g>
  <!-- Knuckles / twists at some crossings (more 3D) -->
  <g fill="#9a9ea4" stroke="#5a5e64" stroke-width="0.4">
    <ellipse cx="24" cy="24" rx="2.1" ry="1.5" transform="rotate(45 24 24)"/>
    <ellipse cx="72" cy="24" rx="2.1" ry="1.5" transform="rotate(45 72 24)"/>
    <ellipse cx="24" cy="72" rx="2.1" ry="1.5" transform="rotate(45 24 72)"/>
    <ellipse cx="72" cy="72" rx="2.1" ry="1.5" transform="rotate(45 72 72)"/>
    <ellipse cx="48" cy="0" rx="2.1" ry="1.5" transform="rotate(45 48 0)"/>
    <ellipse cx="48" cy="48" rx="2.1" ry="1.5" transform="rotate(45 48 48)"/>
    <ellipse cx="48" cy="96" rx="2.1" ry="1.5" transform="rotate(45 48 96)"/>
    <ellipse cx="0" cy="48" rx="2.1" ry="1.5" transform="rotate(45 0 48)"/>
    <ellipse cx="96" cy="48" rx="2.1" ry="1.5" transform="rotate(45 96 48)"/>
  </g>
  <!-- Tiny rust freckles on a few knuckles -->
  <g fill="#a05028" fill-opacity="0.75">
    <circle cx="25.2" cy="23.2" r="0.7"/>
    <circle cx="71" cy="73.5" r="0.85"/>
    <circle cx="49.5" cy="47" r="0.65"/>
    <circle cx="1.2" cy="49" r="0.55"/>
  </g>
</svg>
