[package]
name = "freenet-roulette-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Freenet WASM session contract for 1:1 chat after match"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
freenet-stdlib = { workspace = true, features = ["contract"] }
freenet-roulette-common = { workspace = true, default-features = false }
serde = { workspace = true }
ciborium = { workspace = true }

[features]
default = []
freenet-main-contract = ["freenet-stdlib/freenet-main-contract"]
