[package]
name = "freenet-roulette-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser bridge: multi-tab Chat Roulette (simple match server + optional Freenet)"

[[bin]]
name = "roulette-bridge"
path = "src/main.rs"

[features]
default = []
# Optional Freenet control plane (heavier deps)
freenet = [
    "dep:freenet-roulette-common",
    "dep:freenet-roulette-agent",
    "dep:freenet-stdlib",
    "dep:hex",
]

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower = "0.5"
sha2 = { workspace = true }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


# Optional Freenet path
freenet-roulette-common = { workspace = true, features = ["client"], optional = true }
freenet-roulette-agent = { path = "../agent", optional = true }
freenet-stdlib = { version = "0.8.5", features = ["net"], optional = true }
hex = { workspace = true, optional = true }
