# LOCKED 2026-08-10 — relay-to-relay media (peer_usage > 0)
#
# Root cause of peer_usage=0 with external-ip=PUBLIC/VPC_PRIVATE (DO eth0):
#   CreatePermission to PUBLIC was rewritten to VPC private (e.g. 10.19.0.5)
#   while relay sockets bound on PUBLIC → hairpin media blackholed (rp=0).
#
# Proven matrix (dual-allocation ChannelData exchange on same server):
#   external-ip=PUBLIC alone                    → CREATE_PERM self 403
#   external-ip=PUBLIC + allowed-peer-ip=PUBLIC → CREATE_PERM self 403
#   external-ip=PUBLIC/VPC_PRIVATE              → PERM ok, peer_usage=0 (FAIL)
#   external-ip=PUBLIC/PUBLIC                   → PERM ok, peer_usage>0 (PASS)
#   relay-ip=VPC + external-ip=PUBLIC/VPC       → hairpin PASS but internet
#                                                 clients cannot reach relay ports
#
# allow-private-peer-ip is NOT valid on coturn 4.6.1 (Bad configuration format).
# DigitalOcean: public IP is on-host (not 1:1 NAT). Map public→public for
# self-peer whitelist without wrong-interface rewrite.

listening-ip=0.0.0.0
listening-port=3478
# UDP TURN on public 443 is NOT done here. Do not set alt-listening-port=443:
# coturn 4.6.1 also opens a TCP listener on the alt port, HAProxy owns
# TCP/443, and coturn exits fatally after ~60 s of bind retries.
# Instead ruletka-turn-udp443.service REDIRECTs udp/443 -> udp/3478
# (UDP only; TCP 443 stays HAProxy). Clients use
# turn:ruletka.vip:443?transport=udp. Caddy must stay h1/h2 (no QUIC).
# TLS TURN (TURNS) — automatic DPI fallback. Does not bind 443 (Caddy).
# Must stay ON: public 443 (haproxy mux) forwards non-HTTP TLS here, and RU
# mobile clients depend on TURNS. Certs are synced from Caddy by
# /usr/local/sbin/ruletka-turns-tls.sh (ruletka-turns-certs.timer).
# Disabled by mistake 2026-10-13 -> TURNS dead until 2026-11-04.
tls-listening-port=5349
cert=/etc/turnserver/fullchain.pem
pkey=/etc/turnserver/privkey.pem
min-port=49160
max-port=50000

fingerprint
use-auth-secret
static-auth-secret=__TURN_SECRET__

realm=ruletka.vip
server-name=ruletka.vip

external-ip=__PUBLIC_IP__/__PUBLIC_IP__

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600
no-software-attribute

simple-log
log-file=/var/log/turnserver/turn.log
verbose
