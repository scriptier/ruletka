# coturn for ruletka.vip — time-limited credentials via static-auth-secret
# Must match ROULETTE_TURN_SECRET in /opt/ruletka/data/turn.env

listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49300

fingerprint
lt-cred-mech
use-auth-secret
# SECRET filled by setup-turn.sh
static-auth-secret=__TURN_SECRET__

realm=ruletka.vip
server-name=ruletka.vip

# Public IP of this droplet (DigitalOcean FRA1)
external-ip=__PUBLIC_IP__

# Hardening / hygiene
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# No long-term passwords file
stale-nonce=600

# Logging
simple-log
log-file=/var/log/turnserver/turn.log
verbose
