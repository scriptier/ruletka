# LOCKED 2026-08-09 — video path (do not thrash)
#
# Proven matrix (turnutils_uclient CreatePermission/ChannelBind to own public IP):
#   external-ip=PUBLIC alone              → 403 Forbidden IP (relay↔relay broken)
#   external-ip=PUBLIC/PRIVATE            → OK (self-peer + normal peers)
#   allowed-peer-ip as sole allowlist     → DO NOT (CONNECTIVITY_LOCK; can 403 peers)
#
# DigitalOcean: eth0 has public + private VPC IP. Mapping is required.

listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=50000

fingerprint
use-auth-secret
static-auth-secret=__TURN_SECRET__

realm=ruletka.vip
server-name=ruletka.vip

external-ip=__PUBLIC_IP__/__PRIVATE_IP__

# Same-server relay hairpin: browsers CreatePermission to related-address
# (private VPC IP e.g. 10.19.0.5). Without this, peer_usage rp=0 / black cams.
allow-private-peer-ip

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600
no-software-attribute

simple-log
log-file=/var/log/turnserver/turn.log
verbose
