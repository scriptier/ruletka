# TCP 443 mux: HTTP ALPN → Caddy 8443 (PROXY v2 so hub sees real IP)
# other TLS → coturn TURNS 5349
global
	maxconn 4096
	log stdout format raw local0

defaults
	mode tcp
	timeout connect 5s
	timeout client  1h
	timeout server  1h
	option clitcpka
	option srvtcpka
	log global

frontend https_mux
	bind 0.0.0.0:443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req_ssl_hello_type 1 }
	# Browsers send h2 / http/1.1. TURNS (RU) uses SNI ruletka.vip with no HTTP ALPN.
	# ruletka.me is website-only (ICE TURNS URL is ruletka.vip:443) — never coturn,
	# or visitors without ALPN get coturn's vip cert and a white/blank error page.
	use_backend caddy_https if { req.ssl_alpn -i h2 http/1.1 }
	use_backend caddy_https if { req.ssl_sni -i ruletka.me www.ruletka.me }
	default_backend coturn_turns

backend caddy_https
	server caddy 127.0.0.1:8443 send-proxy-v2

backend coturn_turns
	server coturn 127.0.0.1:5349
