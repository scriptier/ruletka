# Public TCP 443 mux for ruletka
# Probe order matters: HTTP ALPN → Caddy; other TLS (TURNS) → coturn.
verbose: 0;
foreground: true;
inetd: false;
numeric: true;
timeout: 2;

listen:
(
    { host: "0.0.0.0"; port: "443"; }
);

protocols:
(
    { name: "tls"; host: "127.0.0.1"; port: "8443"; alpn_protocols: [ "h2", "http/1.1" ]; log_level: 0; },
    { name: "tls"; host: "127.0.0.1"; port: "5349"; log_level: 0; },
    { name: "timeout"; host: "127.0.0.1"; port: "8443"; log_level: 0; },
    { name: "anyprot"; host: "127.0.0.1"; port: "5349"; log_level: 0; }
);

on-timeout: "timeout";
